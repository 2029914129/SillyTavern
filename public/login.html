<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#151618">
    <script src="scripts/furry-theme.js"></script>
    <style>
        :root {
            --furry-critical-bg: #17191d;
        }

        :root[data-furry-theme="light"] {
            --furry-critical-bg: #eef1f4;
        }

        body {
            background: var(--furry-critical-bg);
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="stylesheet" type="text/css" href="css/furry-theme.css">
    <title>登录 - 新酒馆</title>
</head>

<body class="login">
    <main class="auth-page" id="authPage" aria-busy="true">
        <aside class="brand-panel" aria-label="新酒馆">
            <div class="brand-mark">
                <img src="img/logo.png" alt="" class="brand-logo">
                <div>
                    <div class="brand-name">新酒馆</div>
                    <div class="brand-powered">由 SillyTavern 驱动</div>
                </div>
            </div>
            <div class="brand-copy">
                <p class="brand-kicker">YOUR PRIVATE TAVERN</p>
                <h1>故事仍在继续，<br>角色正在等你。</h1>
                <p>登录你的私人空间，继续尚未写完的对话。</p>
            </div>
            <div class="brand-footer">
                <span class="status-dot" aria-hidden="true"></span>
                <span>本地账户系统</span>
            </div>
        </aside>

        <section class="auth-stage">
            <button class="auth-page-back" id="authPageBack" type="button" title="返回上一页" aria-label="返回上一页">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                <span>返回</span>
            </button>
            <div class="mobile-brand" aria-hidden="true">
                <img src="img/logo.png" alt="" class="brand-logo">
                <span>新酒馆</span>
            </div>

            <div class="auth-card">
                <div class="auth-card-header">
                    <div>
                        <p class="eyebrow" id="viewEyebrow">账号登录</p>
                        <h2 id="viewTitle">欢迎回来</h2>
                        <p class="view-description" id="viewDescription">选择账号，或输入登录信息继续。</p>
                    </div>
                    <span class="mode-badge" id="serverModeBadge" hidden></span>
                </div>

                <div class="auth-tabs" id="authTabs" role="tablist" aria-label="账号操作">
                    <button class="auth-tab is-active" id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="loginView">
                        登录
                    </button>
                    <button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false" aria-controls="registerView" hidden>
                        注册
                    </button>
                </div>

                <div class="status-banner" id="errorMessage" role="alert" aria-live="polite" hidden></div>

                <section class="auth-view" id="loginView" role="tabpanel" aria-labelledby="loginTab">
                    <div id="accountChooser">
                        <div class="section-heading">
                            <span id="accountChooserLabel">选择一个账号</span>
                            <span class="account-count" id="accountCount"></span>
                        </div>
                        <div class="user-list" id="userList"></div>
                        <button class="text-button manual-login-button" id="manualLoginButton" type="button">
                            <i class="fa-solid fa-key" aria-hidden="true"></i>
                            <span>使用用户名登录</span>
                        </button>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="selected-account" id="selectedAccount" hidden>
                            <img id="selectedAvatar" src="img/logo.png" alt="" class="selected-avatar">
                            <div class="selected-account-text">
                                <strong id="selectedName"></strong>
                                <span id="selectedHandle"></span>
                            </div>
                            <button class="icon-button" id="changeAccountButton" type="button" title="更换账号" aria-label="更换账号">
                                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                            </button>
                        </div>

                        <div class="field" id="handleEntryBlock">
                            <div class="field-label-row">
                                <label for="userHandle">用户名</label>
                                <button class="text-button" id="backToAccountsButton" type="button">返回账号列表</button>
                            </div>
                            <div class="input-shell">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input id="userHandle" type="text" placeholder="输入用户名" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="96">
                            </div>
                        </div>

                        <div id="passwordEntryBlock">
                            <div class="field">
                                <div class="field-label-row">
                                    <label for="userPassword">密码</label>
                                    <button class="text-button recover-button" id="recoverPassword" type="button">
                                        <span class="button-label">忘记密码？</span>
                                    </button>
                                </div>
                                <div class="input-shell">
                                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                    <input id="userPassword" type="password" placeholder="输入密码" autocomplete="current-password" maxlength="128">
                                    <button class="password-toggle" type="button" data-password-target="userPassword" aria-label="显示密码" title="显示密码">
                                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <button class="primary-button" id="loginButton" type="submit">
                                <span class="button-spinner" aria-hidden="true"></span>
                                <span class="button-label">进入酒馆</span>
                                <i class="fa-solid fa-arrow-right button-icon" aria-hidden="true"></i>
                            </button>
                        </div>
                    </form>
                </section>

                <section class="auth-view" id="registerView" role="tabpanel" aria-labelledby="registerTab" hidden>
                    <form id="registerForm" novalidate>
                        <div class="field">
                            <label for="registerUsername">用户名</label>
                            <div class="input-shell">
                                <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                                <input id="registerUsername" type="text" placeholder="中文或英文用户名" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
                            </div>
                            <p class="field-hint">可使用中文、字母、数字、下划线和短横线。</p>
                        </div>

                        <div class="field">
                            <label for="registerPassword">密码</label>
                            <div class="input-shell">
                                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                <input id="registerPassword" type="password" placeholder="至少 6 个字符" autocomplete="new-password" minlength="6" maxlength="128" required>
                                <button class="password-toggle" type="button" data-password-target="registerPassword" aria-label="显示密码" title="显示密码">
                                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" id="registerButton" type="submit">
                            <span class="button-spinner" aria-hidden="true"></span>
                            <span class="button-label">创建账号</span>
                            <i class="fa-solid fa-arrow-right button-icon" aria-hidden="true"></i>
                        </button>
                    </form>
                </section>

                <section class="auth-view recovery-view" id="passwordRecoveryBlock" aria-labelledby="recoveryTitle" hidden>
                    <div class="recovery-notice">
                        <i class="fa-solid fa-terminal" aria-hidden="true"></i>
                        <div>
                            <strong>恢复码已发送</strong>
                            <p id="recoverMessage">请在服务器控制台中查看六位恢复码。</p>
                        </div>
                    </div>

                    <form id="recoveryForm" novalidate>
                        <div class="field">
                            <label for="recoveryCode">恢复码</label>
                            <div class="input-shell">
                                <i class="fa-solid fa-hashtag" aria-hidden="true"></i>
                                <input id="recoveryCode" type="text" inputmode="numeric" placeholder="输入六位恢复码" autocomplete="one-time-code" maxlength="6" required>
                            </div>
                        </div>

                        <div class="field">
                            <label for="newPassword">新密码</label>
                            <div class="input-shell">
                                <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
                                <input id="newPassword" type="password" placeholder="输入新密码" autocomplete="new-password" minlength="6" maxlength="128" required>
                                <button class="password-toggle" type="button" data-password-target="newPassword" aria-label="显示密码" title="显示密码">
                                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <button class="primary-button" id="sendRecovery" type="submit">
                            <span class="button-spinner" aria-hidden="true"></span>
                            <span class="button-label">重置并登录</span>
                            <i class="fa-solid fa-arrow-right button-icon" aria-hidden="true"></i>
                        </button>
                        <button class="secondary-button" id="cancelRecovery" type="button">返回登录</button>
                    </form>
                </section>
            </div>

            <p class="auth-footnote">账号数据仅保存在当前服务器</p>
        </section>
    </main>

    <script src="scripts/login.js" type="module"></script>
</body>

</html>
